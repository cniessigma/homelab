apiVersion: v1
kind: Service
metadata:
  name: tiermaker-app
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.192.1
  selector:
    app: tiermaker-app
  ports:
    - name: http
      port: 80
      targetPort: 3001
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tiermaker-app-data
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: "nfs-client"
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tiermaker-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tiermaker-app
  template:
    metadata:
      labels:
        app: tiermaker-app
    spec:
      containers:
        - name: tiermaker-app
          image: docker.nies.io:5000/tiermaker_app:v0.7.0
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 250m
              memory: 1Gi
          ports:
            - name: http
              containerPort: 3001
          volumeMounts:
            - name: tiermaker-app-data
              mountPath: /app/server/data
      volumes:
        - name: tiermaker-app-data
          persistentVolumeClaim:
            claimName: tiermaker-app-data
