apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: obojima-tools-config
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: "nfs-client"
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: obojima-tools
spec:
  # Reached through the Cloudflare tunnel at https://obojima.nies.io with an
  # Access application in front, the same way argocd.nies.io works. Access is
  # the outer gate; OBOJIMA_GM_TOKEN in obojima-tools-secret is the inner one.
  type: ClusterIP
  selector:
    app: obojima-tools
  ports:
    - name: http
      port: 8787
      targetPort: 8787
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obojima-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: obojima-tools
  template:
    metadata:
      labels:
        app: obojima-tools
    spec:
      # This application never calls the Kubernetes API.
      automountServiceAccountToken: false
      # Satisfies the PodSecurity "restricted" profile. runAsUser is stated
      # explicitly because the image's USER is the name `node`, and
      # runAsNonRoot cannot verify a non-numeric user on its own. 1000 is the
      # uid the container already runs as.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: obojima-tools
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Replace the tag on every release. Do not use `latest`.
          image: docker.nies.io:5000/obojima-tools:v0.1.3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: FOUNDRY_RELAY_URL
              value: "http://foundry-rest-api.foundry-rest-api.svc.cluster.local:3010"
            - name: FOUNDRY_WORLD_ID
              value: "obojima-spirit-of-worlds-machine"
            # The image directory is root-owned and the process runs as uid
            # 1000, so the GM's actor choice is written to a volume instead.
            - name: OBOJIMA_CONFIG_PATH
              value: "/data/obojima-config.json"
          envFrom:
            # Holds FOUNDRY_RELAY_API_KEY, FOUNDRY_ALCHEMIST_ACTOR_UUID and
            # OBOJIMA_GM_TOKEN. Every screen that returns campaign data needs
            # the GM token once the pod is reachable from anywhere but loopback.
            - secretRef:
                name: obojima-tools-secret
          volumeMounts:
            - name: config
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: obojima-tools-config
