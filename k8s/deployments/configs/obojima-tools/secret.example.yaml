# Template only. Fill in the real values, encrypt with SOPS, and commit the
# result as secret.enc.yaml. Never commit this file with real values.
#
# The two values come from different places. Read the notes on each.
apiVersion: v1
kind: Secret
metadata:
  name: obojima-tools-secret
stringData:
  # ISSUED BY THE RELAY. Do not generate this yourself — a self-made random
  # string is rejected with {"error":"Invalid API key"}. A real key is 64 hex
  # characters and must carry the six scopes below, because the relay refuses
  # any unscoped key. See the foundry-rest-api README for the full flow:
  #
  #   kubectl port-forward -n foundry-rest-api svc/foundry-rest-api 3010:3010
  #   RELAY=http://localhost:3010
  #   TOKEN=$(curl -s -X POST $RELAY/auth/register \
  #     -H 'content-type: application/json' \
  #     -d '{"email":"gm@example.com","password":"<a long password>"}' \
  #     | jq -r .sessionToken)
  #   curl -s -X POST $RELAY/auth/api-keys \
  #     -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
  #     -d '{"name":"obojima-tools","scopes":["entity:read","entity:write","search","clients:read","chat:write","dnd5e"]}' \
  #     | jq -r .key
  FOUNDRY_RELAY_API_KEY: "REPLACE_ME"

  # GENERATE THIS YOURSELF. It is this application's own GM password, not a
  # relay credential:
  #
  #   openssl rand -base64 32
  #
  # Required. Every route that returns campaign data is GM-only, and without
  # this the pod answers loopback requests only — so nothing reaching it
  # through the Service can log in.
  OBOJIMA_GM_TOKEN: "REPLACE_ME"

  # Optional. UUID of the configured alchemist Actor, for example "Actor.abc123".
  # Leave it out to use the in-app GM setup flow instead.
  # FOUNDRY_ALCHEMIST_ACTOR_UUID: "Actor.REPLACE_ME"
