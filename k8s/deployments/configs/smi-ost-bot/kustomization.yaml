apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - storage.yaml
  - backup.yaml

generators:
- |-
  apiVersion: viaduct.ai/v1
  kind: ksops
  metadata:
    name: sops-generator
    annotations:
      config.kubernetes.io/function: |
          exec:
            path: ksops
  files:
    - secret.enc.yaml
    - restic-secret.enc.yaml


configMapGenerator:
  - name: smi-ost-backup-script
    files:
      - backup.py
