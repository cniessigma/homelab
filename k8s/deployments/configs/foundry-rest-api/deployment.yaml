apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: foundry-rest-api-data
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: "nfs-client"
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: foundry-rest-api
spec:
  # Deliberately not a LoadBalancer. Browsers reach the relay through the
  # Cloudflare tunnel at wss://relay.nies.io, with an Access application in
  # front, and cloudflared resolves this Service from inside the cluster.
  #
  # A LAN address here would publish POST /auth/register, which is
  # unauthenticated and only rate limited. Anyone on the LAN could register an
  # account, mint a scoped key, and gain full Foundry CRUD. Use
  # `kubectl port-forward` for administration instead.
  type: ClusterIP
  selector:
    app: foundry-rest-api
  ports:
    - name: http
      port: 3010
      targetPort: 3010
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foundry-rest-api
spec:
  replicas: 1
  strategy:
    # The relay keeps its state in one SQLite file. The volume is ReadWriteMany
    # to match the rest of the cluster, so Recreate is what actually stops two
    # pods writing to that file during a rollout.
    type: Recreate
  selector:
    matchLabels:
      app: foundry-rest-api
  template:
    metadata:
      labels:
        app: foundry-rest-api
    spec:
      # The relay never calls the Kubernetes API, so it gets no token.
      # This limits what a compromise of an internet-facing service reaches.
      automountServiceAccountToken: false
      # Satisfies the PodSecurity "restricted" profile. runAsUser is stated
      # explicitly because the image's USER is the name `appuser`, and
      # runAsNonRoot cannot verify a non-numeric user on its own. 1001 is the
      # uid the container already runs as, so this asserts current behaviour
      # rather than changing it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Built from upstream source for arm64 and published to the local
          # registry. Upstream publishes linux/amd64 only, for every tag,
          # because its runtime stage installs Google Chrome and Chrome has no
          # arm64 Linux build. `make relay-push` in the obojima-tools
          # repository rebuilds this. Pinned; do not use `latest`.
          image: docker.nies.io:5000/foundryvtt-rest-api-relay:3.4.1-arm64
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
          ports:
            - name: http
              containerPort: 3010
          env:
            - name: DB_TYPE
              value: "sqlite"
            - name: APP_ENV
              value: "production"
            - name: PORT
              value: "3010"
            # The account that owns the API key and the paired world already
            # exists, and this relay serves one campaign. Closing registration
            # removes the only unauthenticated write endpoint reachable if
            # Cloudflare Access is ever misconfigured.
            # To add an account later, set this false, register, then restore.
            - name: DISABLE_REGISTRATION
              value: "true"
          envFrom:
            - secretRef:
                name: foundry-rest-api-secret
          volumeMounts:
            - name: data
              mountPath: /app/data
          # TCP probes are correct here: the relay has no health route. A
          # `GET /health` returns 404, and every API route needs a scoped API
          # key, so there is nothing to probe over HTTP without embedding a
          # credential in the manifest.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: foundry-rest-api-data
