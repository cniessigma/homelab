# Stage 2: activate only these isolated writers after verifying the legacy
# movers have stopped. Keep the original sources in backup.yaml paused.
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: foundry-worlds-isolated-backup
spec:
  paused: false
  sourcePVC: foundry-worlds
  trigger:
    schedule: "0 * * * *"
  restic:
    repository: foundry-worlds-restic-secret
    copyMethod: Direct
    cacheStorageClassName: nfs-client
    pruneIntervalDays: 7
    retain:
      hourly: 24
      daily: 30
      weekly: 26
      monthly: 12
---
