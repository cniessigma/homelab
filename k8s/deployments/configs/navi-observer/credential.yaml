apiVersion: v1
kind: Secret
metadata:
  name: navi-observer-credential
  namespace: navi-observer
  annotations:
    kubernetes.io/service-account.name: navi-observer
    # Create after the ServiceAccount; the token controller fills data/UID.
    argocd.argoproj.io/sync-wave: '1'
# Metadata only. Never commit data/stringData or copy a populated live export.
# Deliberately not referenced in ServiceAccount.secrets: this is a manually
# managed credential, not an automatically generated legacy token.
type: kubernetes.io/service-account-token
