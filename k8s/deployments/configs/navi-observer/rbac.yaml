apiVersion: v1
kind: ServiceAccount
metadata:
  name: navi-observer
  namespace: navi-observer
# External observer, not a pod identity. The separately managed credential
# Secret is deliberately not referenced in ServiceAccount.secrets.
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: navi-observer
  namespace: obojima-tools
rules:
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['apps']
    resources: ['replicasets']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['apps']
    resources: ['deployments']
    resourceNames: ['obojima-tools']
    verbs: ['get', 'list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: navi-observer
  namespace: obojima-tools
subjects:
  - kind: ServiceAccount
    name: navi-observer
    namespace: navi-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: navi-observer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: navi-observer
  namespace: argocd
rules:
  - apiGroups: ['argoproj.io']
    resources: ['applications']
    resourceNames: ['obojima-tools']
    verbs: ['get', 'list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: navi-observer
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: navi-observer
    namespace: navi-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: navi-observer
