apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: csi-snapshotter
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kube-system
  project: default
  sources:
    - path: k8s/deployments/configs/csi-snapshotter
      repoURL: git@github.com:cniessigma/homelab.git
      targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
