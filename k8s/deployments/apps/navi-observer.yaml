apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: navi-observer
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: navi-observer
  project: default
  sources:
    - path: k8s/deployments/configs/navi-observer
      repoURL: git@github.com:cniessigma/homelab.git
      targetRevision: HEAD
  # Only this named Secret's controller-generated fields are ignored. Never
  # erase/recommit its generated credential during normal GitOps reconciliation.
  ignoreDifferences:
    - group: ''
      kind: Secret
      name: navi-observer-credential
      namespace: navi-observer
      jsonPointers:
        - /data
        - /metadata/annotations/kubernetes.io~1service-account.uid
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    automated:
      prune: true
      selfHeal: true
